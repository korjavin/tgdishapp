version: '3.8'

services:
  app:
    image: ${IMAGE_NAME} # Use an environment variable for the image name
    restart: always
    env_file:
      - .env
    volumes:
      - db_data:/app/db # Mount the database volume

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}

volumes:
  db_data:
  caddy_data:
  caddy_config:
